[package]
name = "celira-agent"
version = "0.1.3"
edition = "2024"
description = "Celira Agent：最小骨架 + 最小 Provider Adapter（Core -> ModelPort -> DeepSeek Adapter -> wire）；无 OS、无 App、无持久化"
license = "MIT"

# 独立 crate：不属于根 Cargo workspace（根 members 只有 `im/server`）。
# 空 [workspace] 表是让本 crate 成为自己的 workspace 根，从而可以独立 build / test，
# 且不需要改动根 Cargo.toml。
[workspace]

# 这些依赖分两类：
# - reqwest / serde / serde_json：Provider Adapter 的 wire 与传输，以及 MCP App 的外部协议搬运；
# - rmcp / tokio：MCP 边缘的协议客户端与异步宿主（Core / Foundation 不得引用它们）。
# 边界由 tests/minimal_agent.rs 的依赖与分层守卫机械检查。
[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
axum = "0.8"
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
