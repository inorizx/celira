<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0 0.30  0 0 0 0.05 0"/>
    </filter>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3ecdc"/>
      <stop offset="100%" stop-color="#e9dfc8"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#warm)"/>
  <rect width="1440" height="900" filter="url(#grain)"/>
</svg>
