# IM 系统 server crate（2026-09-11 目录重排：src+tests+migrations 随包迁入 im/server/）。
# 无独立 workspace 声明：属于根虚拟 workspace 成员。
[package]
name = "celira-im"
# 版本继承根 `[workspace.package].version`（唯一权威，TASK_48）——不在成员里各写一份。
version.workspace = true
edition = "2024"
description = "Celira Core V1 single binary service"
license = "MIT"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "process", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "celira-mock-backend"
path = "src/bin/mock_backend.rs"

[dev-dependencies]
filetime = "0.2"
http-body-util = "0.1"
sha1 = "0.10"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
